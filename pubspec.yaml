name: dart_reporting
description: >-
  A static analysis and code audit CLI tool for Dart/Flutter projects.
  Generates SARIF reports for GitHub Actions integration.
version: 1.0.0
repository: https://github.com/Thematt69/dart_reporting

environment:
  sdk: ^3.11.4

dependencies:
  args: ^2.6.0
  crypto: ^3.0.6
  http: ^1.3.0
  path: ^1.9.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
